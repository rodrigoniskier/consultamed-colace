name: Initialize COLACE clone

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Clone ConsultaMed source
        run: |
          git clone --depth 1 https://github.com/rodrigoniskier/consultamed.git /tmp/consultamed-source
          rsync -a --delete --exclude='.git' /tmp/consultamed-source/ ./

      - name: Apply COLACE identity and deployment-safe defaults
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          allowed = {'.md', '.json', '.html', '.tsx', '.ts', '.css', '.js', '.txt', '.example'}
          skip_dirs = {'.git', 'node_modules'}
          replacements = [
              ('ConsultaMed - Agendamento', 'COLACE - Agendamento'),
              ('ConsultaMed', 'COLACE'),
          ]

          for p in root.rglob('*'):
              if not p.is_file() or any(part in skip_dirs for part in p.parts):
                  continue
              if p.suffix.lower() not in allowed and p.name not in {'.env.example', '.gitignore'}:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, repl in replacements:
                  new = new.replace(old, repl)
              if new != text:
                  p.write_text(new, encoding='utf-8')

          package = Path('package.json')
          if package.exists():
              data = json.loads(package.read_text(encoding='utf-8'))
              data['name'] = 'consultamed-colace'
              package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          metadata = Path('metadata.json')
          if metadata.exists():
              data = json.loads(metadata.read_text(encoding='utf-8'))
              data['name'] = 'COLACE - Agendamento'
              data['description'] = 'Sistema de agendamento da rede COLACE, com fluxos de secretaria e acompanhamento médico em tempo real.'
              metadata.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          manifest_path = Path('public/manifest.json')
          if manifest_path.exists():
              data = json.loads(manifest_path.read_text(encoding='utf-8'))
              data['name'] = 'COLACE - Agendamento'
              data['short_name'] = 'COLACE'
              data['description'] = 'Sistema de agendamento da rede COLACE'
              manifest_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          Path('.env.example').write_text('''# COLACE - ambiente separado do ConsultaMed original\n# Preencha estes valores apenas no ambiente de implantação; não faça commit de credenciais reais.\n\nVITE_SUPABASE_URL=""\nVITE_SUPABASE_ANON_KEY=""\n\n# Mantidos para compatibilidade caso alguma integração futura os utilize.\nGEMINI_API_KEY=""\nAPP_URL=""\n''', encoding='utf-8')

          Path('PYTHONANYWHERE-COLACE.md').write_text('''# Implantação COLACE no PythonAnywhere\n\nEste repositório é uma cópia independente do `rodrigoniskier/consultamed`, preparada para a rede COLACE.\n\n## Isolamento obrigatório\n\nUse um projeto/banco Supabase próprio da COLACE. Não reutilize `VITE_SUPABASE_URL` nem `VITE_SUPABASE_ANON_KEY` do ConsultaMed original, pois isso faria as duas redes compartilharem usuários, agendas e dados.\n\n## Após clonar/puxar no PythonAnywhere\n\n1. Crie `.env.local` a partir de `.env.example`.\n2. Informe as credenciais do Supabase exclusivo da COLACE.\n3. Execute `npm ci`.\n4. Execute `npm run build`.\n5. Configure o Web App/arquivos estáticos para servir a pasta `dist` conforme a instalação PythonAnywhere usada pelo ConsultaMed original.\n\n## Banco\n\nA aplicação espera o mesmo esquema de tabelas/perfis utilizado pelo ConsultaMed. O esquema e os dados devem ser replicados para um projeto Supabase novo antes de colocar a COLACE em produção.\n''', encoding='utf-8')
          PY

          cat > public/logo.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 160" role="img" aria-label="COLACE">
            <rect width="512" height="160" rx="24" fill="#ffffff"/>
            <text x="256" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" fill="#0f172a">COLACE</text>
          </svg>
          SVG

          grep -RIl --exclude-dir=.git --exclude-dir=node_modules 'logo.png' src public index.html 2>/dev/null | while read -r f; do
            sed -i 's/logo\.png/logo.svg/g' "$f"
          done
          rm -f public/logo.png

      - name: Install dependencies and rebuild distributable
        run: |
          npm ci
          npm run build

      - name: Remove obsolete artifacts and one-time workflow
        run: |
          rm -f dist/logo.png
          rm -f .clone-seed
          rm -f .github/workflows/initialize-colace.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit initialized COLACE project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clone ConsultaMed and initialize COLACE deployment'
          git push origin main
