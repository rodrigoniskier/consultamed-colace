name: Finalize COLACE branding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-colace-brand.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove remaining institutional branding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'alt="UNIPÊ Logo"': 'alt="COLACE Logo"',
              '<h2 className="text-2xl font-bold text-white tracking-tight">Medicina <span className="text-[#FCA311]">UNIPÊ</span></h2>': '<h2 className="text-2xl font-bold text-white tracking-tight">COLACE</h2>',
              'Agendamento de Consultas do Internato': 'Sistema de Agendamento de Consultas',
              'Medicina - UNIPÊ': 'COLACE - Rede de Clínicas',
          }

          for p in Path('src').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.tsx', '.ts', '.css'}:
                  continue
              text = p.read_text(encoding='utf-8')
              new = text
              for old, repl in replacements.items():
                  new = new.replace(old, repl)
              if new != text:
                  p.write_text(new, encoding='utf-8')
          PY

          cat > README.md <<'EOF'
          # COLACE - Sistema de Agendamento

          Sistema web/PWA de agendamento para a rede COLACE, derivado do projeto ConsultaMed e mantido em repositório independente.

          ## Stack

          - React 19 + TypeScript
          - Vite
          - Supabase (autenticação e banco)
          - Tailwind CSS

          ## Configuração

          Copie `.env.example` para `.env.local` e informe **exclusivamente** as credenciais do projeto Supabase da COLACE:

          ```bash
          cp .env.example .env.local
          ```

          Variáveis essenciais:

          - `VITE_SUPABASE_URL`
          - `VITE_SUPABASE_ANON_KEY`

          Não reutilize as credenciais do ConsultaMed original se as duas redes precisarem manter usuários, pacientes e agendas isolados.

          ## Desenvolvimento

          ```bash
          npm ci
          npm run dev
          ```

          ## Build de produção

          ```bash
          npm run build
          ```

          O resultado é gerado em `dist/`.

          ## PythonAnywhere

          Consulte `PYTHONANYWHERE-COLACE.md` para o checklist específico de implantação.
          EOF

      - name: Sync lockfile and rebuild
        run: |
          npm install --package-lock-only
          npm ci
          npm run build

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/finalize-colace-brand.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize COLACE branding and deployment configuration'
          git push origin main
